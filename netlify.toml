# roundware.app on Netlify. Everything the build needs is in this repository.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Short addresses people will guess or type.
[[redirects]]
  from = "/privacy"
  to = "/legal/privacy/"
  status = 301
[[redirects]]
  from = "/terms"
  to = "/legal/terms/"
  status = 301
[[redirects]]
  from = "/login"
  to = "https://admin.roundware.app/login"
  status = 302
[[redirects]]
  from = "/signin"
  to = "https://admin.roundware.app/login"
  status = 302
[[redirects]]
  from = "/register"
  to = "https://admin.roundware.app/register"
  status = 302
[[redirects]]
  from = "/signup"
  to = "https://admin.roundware.app/register"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
